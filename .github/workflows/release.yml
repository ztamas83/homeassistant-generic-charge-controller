name: Release

# Push a tag vX.Y.Z (or vX.Y.Z-beta.N for a pre-release) to publish a release.
# HACS installs the zip attached to the GitHub release (see hacs.json).
on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches manifest version
        run: |
          manifest=$(jq -r .version custom_components/generic_charge_controller/manifest.json)
          if [ "${GITHUB_REF_NAME#v}" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make build

      - name: Package
        working-directory: custom_components/generic_charge_controller
        run: zip -r "$GITHUB_WORKSPACE/generic_charge_controller.zip" . -x '*__pycache__*'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" generic_charge_controller.zip \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $prerelease
